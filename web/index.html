<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigil</title>
<style>
  /* A quiet ward: ink, hairlines, one signal colour per priority. */
  :root {
    --ink: #0b0e11; --paper: #d9d4c7; --dim: #7d8388; --faint: #2a3036; --line: #1a1f24;
    --sea: #8fb4c4; --amber: #e2a93b; --red: #e5584b; --calm: #79a58a;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }
  :root[data-theme="day"] {
    --ink: #f1eee6; --paper: #1b1f23; --dim: #6b7076; --faint: #cdc8ba; --line: #ddd8ca;
    --sea: #2f6b86; --amber: #b07a0c; --red: #b8372c; --calm: #3f7b58;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--paper); font: 15px/1.5 var(--serif); }
  main { max-width: 1280px; margin: 0 auto; padding: 30px 44px 36px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .mark { font: 600 12px var(--mono); letter-spacing: .42em; color: var(--dim); }
  .mark b { color: var(--paper); font-weight: 600; }
  #word { font: italic 400 52px/1 var(--serif); letter-spacing: -.01em; margin-top: 18px; }
  #word.clear { color: var(--calm); } #word.low { color: var(--sea); } #word.medium { color: var(--amber); } #word.high { color: var(--red); }
  #summary { font: 12px var(--mono); color: var(--dim); text-align: right; line-height: 1.7; letter-spacing: .04em; }
  #audio { color: var(--amber); }
  .label { font: 600 10.5px var(--mono); letter-spacing: .3em; text-transform: uppercase; color: var(--dim); margin: 36px 0 10px; }
  .bed { display: grid; grid-template-columns: 110px repeat(5, minmax(86px, 1fr)) 96px; gap: 8px 18px; align-items: end;
         padding: 16px 0 14px; border-top: 1px solid var(--line); }
  .bed:first-of-type { border-top-color: var(--faint); }
  .bed.offline { opacity: .55; }
  .id .n { font: 400 34px/1 var(--serif); }
  .id .s { font: 600 10px var(--mono); letter-spacing: .2em; margin-top: 6px; color: var(--dim); }
  .bed.low .s { color: var(--sea); } .bed.medium .s { color: var(--amber); } .bed.high .s { color: var(--red); }
  .v .k { font: 10px var(--mono); letter-spacing: .18em; color: var(--dim); text-transform: uppercase; }
  .v .x { font: 400 30px/1.15 var(--mono); }
  .v .x small { font-size: 12px; color: var(--dim); margin-left: 4px; }
  .v.low .x { color: var(--sea); } .v.medium .x { color: var(--amber); } .v.high .x { color: var(--red); }
  .v.stale .x { color: var(--faint); } .v .why { font: italic 12px var(--serif); color: var(--amber); min-height: 16px; }
  svg.sp { display: block; width: 100%; height: 22px; margin-top: 2px; }
  svg.sp polyline { fill: none; stroke: var(--dim); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .v.low svg.sp polyline { stroke: var(--sea); } .v.medium svg.sp polyline { stroke: var(--amber); } .v.high svg.sp polyline { stroke: var(--red); }
  .score { text-align: right; }
  .score .k { font: 10px var(--mono); letter-spacing: .18em; color: var(--dim); }
  .score .x { font: italic 400 40px/1 var(--serif); }
  .score .b { font: 10px var(--mono); letter-spacing: .14em; color: var(--dim); margin-top: 4px; }
  .score.low .x { color: var(--sea); } .score.medium .x { color: var(--amber); } .score.high .x { color: var(--red); }
  .alarm { padding: 12px 0 13px; border-top: 1px solid var(--line); display: flex; gap: 20px; align-items: baseline; flex-wrap: wrap; }
  .alarm .p { font: 600 10.5px var(--mono); letter-spacing: .2em; width: 70px; }
  .alarm.low .p { color: var(--sea); } .alarm.medium .p { color: var(--amber); } .alarm.high .p { color: var(--red); }
  .alarm .t { font-size: 22px; } .alarm .d { font: italic 14px var(--serif); color: var(--dim); }
  .none { color: var(--dim); font-style: italic; }
  .health { display: flex; gap: 34px; flex-wrap: wrap; }
  .health b { display: block; font: 400 17px var(--mono); } .health span { font: 10px var(--mono); color: var(--dim); letter-spacing: .14em; text-transform: uppercase; }
  .foot { margin-top: 30px; font: 11px var(--mono); color: var(--dim); letter-spacing: .06em; }
  #conn { font: 11px var(--mono); color: var(--amber); letter-spacing: .08em; }
  /* Detail: numerals that do not jitter, a breathing "live" dot, a heartbeat hairline, a warm glow on the verdict. */
  .v .x, .score .x, .id .n, .health b { font-variant-numeric: tabular-nums; }
  #word { text-shadow: 0 0 38px color-mix(in srgb, currentColor 26%, transparent); transition: color .6s ease; }
  #live { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--calm); margin-right: 8px; vertical-align: 1px; animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
  #beat { display: block; width: 168px; height: 22px; margin: 14px 0 0; overflow: visible; }
  #beat path { fill: none; stroke: var(--dim); stroke-width: 1; stroke-linecap: round; stroke-dasharray: 220; stroke-dashoffset: 220; animation: trace 3.2s linear infinite; opacity: .7; }
  @keyframes trace { 0% { stroke-dashoffset: 220; } 60%, 100% { stroke-dashoffset: 0; } }
  .bed { position: relative; transition: background .5s ease; }
  .bed.medium { background: linear-gradient(90deg, color-mix(in srgb, var(--amber) 7%, transparent), transparent 40%); }
  .bed.high { background: linear-gradient(90deg, color-mix(in srgb, var(--red) 11%, transparent), transparent 45%); }
  .bed.high::before, .bed.medium::before { content: ""; position: absolute; left: -14px; top: 14px; bottom: 12px; width: 2px; border-radius: 2px; background: var(--amber); }
  .bed.high::before { background: var(--red); animation: alert 1.2s ease-in-out infinite; }
  @keyframes alert { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .v .x { transition: color .4s ease; }
  .alarm.high .t { color: var(--red); }
  /* Freshness: when vigild stops delivering, nothing on screen may pass for live. */
  #conn.bad { font-size: 13px; color: var(--red); border-left: 2px solid var(--red); padding: 6px 12px; margin: 14px 0 0; letter-spacing: .04em; }
  #live.off { animation: none; background: var(--faint); }
  #word.historic { color: var(--dim); text-shadow: none; }
  main.historic .bed, main.historic .alarm, main.historic #health { opacity: .4; }
  main.historic .score .x, main.historic .v .x { color: var(--dim); }
  main.historic .bed.high::before, main.historic .bed.medium::before { animation: none; background: var(--faint); }
  main.historic .bed.medium, main.historic .bed.high { background: none; }
  @media (prefers-reduced-motion: reduce) { #live, #beat path, .bed.high::before { animation: none; } #beat path { stroke-dashoffset: 0; } }
  @media (max-width: 900px) { main { padding: 22px 18px; } .bed { grid-template-columns: repeat(3, 1fr); } .id { grid-column: 1 / -1; display: flex; gap: 14px; align-items: baseline; } .score { text-align: left; } }
</style>
</head>
<body>
<main>
  <header>
    <div><div class="mark">VI<b>GIL</b></div><div id="word" class="clear">&nbsp;</div>
      <svg id="beat" viewBox="0 0 168 22" aria-hidden="true"><path d="M0 12 H48 L54 12 L58 4 L63 19 L68 8 L72 12 H110 L115 12 L118 7 L122 14 L126 12 H168"/></svg></div>
    <div id="summary"></div>
  </header>
  <div id="conn"></div>
  <p class="label">Beds</p>
  <div id="beds"></div>
  <p class="label">Alarms</p>
  <div id="alarms"></div>
  <div id="healthcard"><p class="label">Engine</p><div class="health" id="health"></div></div>
  <div class="foot">illustrative software, not a medical device &middot; NEWS2 after the Royal College of Physicians (2017) &middot; priorities after IEC 60601-1-8</div>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
if (q.get("theme") === "day") document.documentElement.dataset.theme = "day";
if (q.get("zoom")) document.body.style.zoom = q.get("zoom");   // e.g. ?zoom=0.7 to fit a whole ward on one screen
if (q.get("clean") === "1") $("healthcard").style.display = "none"; // hide timing figures (licence: no performance claims)

// key, label, unit, decimals, minimum sparkline span (so stable noise stays visually flat)
const PARAMS = [["hr", "HR", "bpm", 0, 30], ["spo2", "SpO2", "%", 0, 10], ["rr", "RR", "/min", 0, 14], ["sbp", "SBP", "mmHg", 0, 40], ["temp", "TEMP", "°C", 1, 2]];
const hist = {}; // "bed:param" -> recent values
let pic = null, source = "";
const cls = (l) => (l || "none").toLowerCase();
const fmt = (v, d) => (v === null || v === undefined ? "—" : v.toFixed(d));
function el(tag, c, text) { const e = document.createElement(tag); if (c) e.className = c; if (text !== undefined) e.textContent = text; return e; }

/* FRESHNESS:BEGIN  pure logic, no DOM: unit-tested by tests/web/freshness.test.js (node --test) */
/*
 * What "live" means. A picture is live only while fresh samples keep arriving. A sample is fresh when
 * vigild's own cycle counter (seq) or clock (t_ms) moved since the previous one, so a server that keeps
 * answering with a frozen picture is stale just like a server that does not answer. A request that gets
 * no answer within timeoutMs is abandoned. After staleMs without a fresh sample the panel stops claiming
 * "live": values become historic and show when the last valid update arrived. A restarted daemon
 * starts its counters again; that is a fresh sample, so the live state returns by itself.
 */
const FRESH = { pollMs: 500, timeoutMs: 2000, staleMs: 3000 };

function newPanel(cfg) {
  return { cfg: Object.assign({}, FRESH, cfg), pic: null, last: null, lastOkAt: null, lastOkWall: null,
           lastError: "", errors: 0, restarts: 0 };
}

function acceptSample(st, p, now, wall) {
  if (!p || typeof p.seq !== "number" || typeof p.t_ms !== "number" || !Array.isArray(p.beds)) return { fresh: false, reason: "malformed" };
  if (st.last && p.seq === st.last.seq && p.t_ms === st.last.t_ms) return { fresh: false, reason: "frozen" };
  const restarted = !!st.last && (p.seq < st.last.seq || p.t_ms < st.last.t_ms);
  st.last = { seq: p.seq, t_ms: p.t_ms };
  st.pic = p; st.lastOkAt = now; st.lastOkWall = wall; st.lastError = "";
  if (restarted) st.restarts++;
  return { fresh: true, restarted };
}

function liveness(st, now) {
  if (st.lastOkAt === null) return { state: "connecting", ageMs: null };
  const age = now - st.lastOkAt;
  return { state: age <= st.cfg.staleMs ? "live" : "stale", ageMs: age };
}

function failure(st, text) { st.errors++; st.lastError = text; return { fresh: false, reason: "error" }; }

async function pollOnce(st, env) {
  const ctl = new env.AbortController();
  let timer;
  const deadline = new Promise((_, reject) => { timer = env.setTimeout(() => { ctl.abort(); reject(new Error("timeout")); }, st.cfg.timeoutMs); });
  try {
    const body = (async () => {
      const r = await env.fetch("/api/picture", { cache: "no-store", signal: ctl.signal });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })();
    body.catch(() => {}); // a late rejection after the timeout must not surface
    const p = await Promise.race([body, deadline]);
    const res = acceptSample(st, p, env.now(), env.wall());
    if (!res.fresh) st.lastError = res.reason === "frozen" ? "daemon answers with the same sequence" : "malformed picture";
    return res;
  } catch (e) {
    return failure(st, e && e.message === "timeout" ? "no answer within " + st.cfg.timeoutMs / 1000 + " s" : String((e && e.message) || e));
  } finally { env.clearTimeout(timer); }
}
/* FRESHNESS:END */

const panel = newPanel({ staleMs: +(q.get("stale_ms") || FRESH.staleMs), timeoutMs: +(q.get("timeout_ms") || FRESH.timeoutMs) });
const clock = (w) => new Date(w).toLocaleTimeString([], { hour12: false });

function ingest(p, restarted) {
  if (restarted) for (const k of Object.keys(hist)) delete hist[k];
  pic = p;
  for (const b of p.beds) for (const [k] of PARAMS) {
    const h = (hist[b.bed + ":" + k] = hist[b.bed + ":" + k] || []);
    h.push(b[k] === undefined ? null : b[k]); if (h.length > 90) h.shift();
  }
}

function spark(key, minSpan) {
  const NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS, "svg");
  svg.setAttribute("class", "sp"); svg.setAttribute("viewBox", "0 0 100 22"); svg.setAttribute("preserveAspectRatio", "none");
  const h = hist[key] || [], vs = h.filter((v) => v !== null);
  if (vs.length > 1) {
    const mn = Math.min(...vs), mx = Math.max(...vs), span = Math.max(mx - mn, minSpan), lo = (mx + mn) / 2 - span / 2;
    const pts = h.map((v, i) => v === null ? null : (i / (h.length - 1) * 100).toFixed(1) + "," + (20 - (v - lo) / span * 18).toFixed(1)).filter(Boolean);
    const pl = document.createElementNS(NS, "polyline"); pl.setAttribute("points", pts.join(" ")); svg.append(pl);
  }
  return svg;
}

function alarmText(b, a) {
  const p = PARAMS.find((x) => x[1] === a.src);
  if (p) return [`${a.src} ${fmt(b[p[0]], p[3])} ${p[2]}`, ""];
  if (a.src === "NEWS2") return ["NEWS2 score " + (b.news2 ? b.news2.total : "?"), b.news2 ? b.news2.band.toLowerCase() + " clinical risk: request a clinical review" : ""];
  if (a.src === "SENSOR") return ["Sensor not delivering", (b.stale || []).join(", ") + " not judged until it returns"];
  return ["No data from this bed", Math.round(b.age_ms / 1000) + " s of silence"];
}

// lv: {state: "live" | "stale" | "connecting"}; a replay is always "live" (it is not a connection).
function render(lv) {
  const main = document.querySelector("main"), historic = lv.state === "stale";
  main.classList.toggle("historic", historic);
  document.title = historic ? "Vigil — NO LIVE DATA" : "Vigil";
  const conn = $("conn");
  if (source === "live" && lv.state !== "live") {
    const when = panel.lastOkWall === null ? "" : "last valid update " + clock(panel.lastOkWall) + " (" + Math.round(lv.ageMs / 1000) + " s ago)";
    conn.className = "bad";
    conn.textContent = lv.state === "connecting" ? "CONNECTING TO VIGILD… " + (panel.lastError ? "(" + panel.lastError + ")" : "")
      : "NO LIVE DATA · the values below are historic · " + when + (panel.lastError ? " · " + panel.lastError : "");
  } else { conn.className = ""; conn.textContent = ""; }
  if (!pic) return;

  const w = $("word"), top = pic.highest;
  const unscored = pic.beds.some((b) => b.online && !b.news2);
  w.className = historic ? "historic" : top === "NONE" ? (unscored ? "low" : "clear") : cls(top);
  w.textContent = historic ? "No live data" : top === "NONE" ? (unscored ? "No alarms" : "Stable") : top === "HIGH" ? "Urgent" : top === "MEDIUM" ? "Attention" : "Aware";
  const parts = [];
  if (pic.n_high) parts.push(pic.n_high + " high");
  if (pic.n_medium) parts.push(pic.n_medium + " medium");
  if (pic.n_low) parts.push(pic.n_low + " low");
  const dot = el("i"); dot.id = "live"; if (historic) dot.className = "off";
  const tag = source === "replay" ? "replay" : historic ? "historic · last update " + (panel.lastOkWall === null ? "—" : clock(panel.lastOkWall)) : source;
  $("summary").replaceChildren(document.createTextNode((historic ? "last known: " : "") + (parts.length ? parts.join("  ·  ") : "no active alarms") + (!historic && unscored ? "  ·  some beds not scored" : "")),
    el("br"), dot, document.createTextNode(tag));
  if (pic.audio.paused && !historic) { const a = el("div", "", "audio paused " + pic.audio.remaining_s + " s (visual alarms unaffected)"); a.id = "audio"; $("summary").append(a); }

  const box = $("beds"); box.replaceChildren();
  for (const b of pic.beds) {
    const lvl = cls(b.level), row = el("div", "bed " + (b.online ? lvl : "offline"));
    const id = el("div", "id"); id.append(el("div", "n", String(b.bed).padStart(2, "0")),
      el("div", "s", historic ? "HISTORIC" : !b.online ? "NO DATA" : b.level === "NONE" ? (b.news2 ? "STABLE" : "NOT SCORED") : b.level + (b.audible ? " ♪" : "")));
    row.append(id);
    for (const [k, lab, unit, d, minSpan] of PARAMS) {
      const key = b.bed + ":" + k;
      const stale = (b.stale || []).includes(lab), alarm = (b.alarms || []).find((a) => a.src === lab);
      const v = el("div", "v " + (stale || !b.online ? "stale" : cls(alarm && alarm.level)));
      v.append(el("div", "k", lab));
      const x = el("div", "x", fmt(b[k], d)); if (b[k] !== null && b.online) x.append(el("small", "", unit)); v.append(x);
      v.append(el("div", "why", historic ? "historic" : stale ? "sensor off" : ""), spark(key, minSpan));
      row.append(v);
    }
    const n = b.news2, sc = el("div", "score " + (n && !historic ? ({ HIGH: "high", MEDIUM: "medium", "LOW-MEDIUM": "low" }[n.band] || "") : ""));
    sc.append(el("div", "k", "NEWS2"), el("div", "x", n ? String(n.total) : "—"), el("div", "b", historic ? "HISTORIC" : n ? n.band : "NOT SCORED" + (b.news2_missing && b.news2_missing.length ? ": " + b.news2_missing.join(" ") : "")));
    row.append(sc); box.append(row);
  }

  const al = $("alarms"); al.replaceChildren();
  const order = { HIGH: 3, MEDIUM: 2, LOW: 1 }, rows = [];
  for (const b of pic.beds) for (const a of b.alarms || []) rows.push([b, a]);
  rows.sort((x, y) => order[y[1].level] - order[x[1].level] || x[0].bed - y[0].bed);
  if (historic) al.append(el("div", "none", rows.length ? "Last known alarms, not current:" : "No alarms were active at the last valid update."));
  else if (!rows.length) al.append(el("div", "none", "Nothing needs attention."));
  for (const [b, a] of rows) {
    const [t, d] = alarmText(b, a), r = el("div", "alarm " + cls(a.level));
    r.append(el("div", "p", a.level), el("div", "t", "Bed " + b.bed + " — " + t)); if (d) r.append(el("div", "d", d)); al.append(r);
  }

  const h = pic.health, hl = $("health"); hl.replaceChildren();
  const live = h.cycles > 0, us = (v) => (live ? v + " µs" : "—");
  for (const [v, l] of [[live ? h.period_us / 1000 + " ms" : "—", "period"], [us(h.last_cycle_us), "cycle"], [live ? String(h.overruns) : "—", "late engine wakes"],
                        [us(h.last_latency_us), "wake latency"], [String(h.samples), "frames"], [String(h.bad_frames), "rejected"]]) {
    const d = el("div"); d.append(el("b", "", v), el("span", "", l)); hl.append(d);
  }
}

const liveNow = () => (source === "live" ? liveness(panel, performance.now()) : { state: "live", ageMs: 0 });
async function poll() {
  const res = await pollOnce(panel, { fetch: (u, o) => fetch(u, o), AbortController, setTimeout: (f, ms) => setTimeout(f, ms), clearTimeout: (t) => clearTimeout(t),
                                      now: () => performance.now(), wall: () => Date.now() });
  source = "live";
  if (res.fresh) ingest(panel.pic, res.restarted);
  render(liveNow());
  setTimeout(poll, panel.cfg.pollMs);
}
async function replay(url) {
  const speed = +(q.get("speed") || 1);
  const frames = (await (await fetch(url)).text()).split("\n").filter((l) => l.startsWith("{")).map((l) => JSON.parse(l));
  if (!frames.length) return;
  source = "replay";
  const fixed = q.get("frame"), show = (p) => { ingest(p, false); render({ state: "live", ageMs: 0 }); };
  if (fixed !== null) { const n = Math.min(frames.length - 1, Math.max(0, +fixed)); for (let i = Math.max(0, n - 60); i <= n; i++) show(frames[i]); return; }
  let i = 0; const tick = () => { show(frames[i]); i = (i + 1) % frames.length; setTimeout(tick, 250 / speed); }; tick();
}
const src = q.get("src");
if (src) replay(src); else { source = "live"; render(liveNow()); setInterval(() => render(liveNow()), 500); poll(); }
</script>
</body>
</html>
